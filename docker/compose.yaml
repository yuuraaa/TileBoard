services:
  dev:
    image: node:22-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && (pnpm dev:backend & pnpm dev:frontend & wait)"
    volumes:
      - ..:/app
      - node_modules_root:/app/node_modules
      - node_modules_frontend:/app/frontend/node_modules
      - node_modules_backend:/app/backend/node_modules
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      - FRONTEND_DIST=/app/frontend/dist
      - PORT=3000

volumes:
  node_modules_root:
  node_modules_frontend:
  node_modules_backend:
